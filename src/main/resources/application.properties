spring.application.name=sistema-cjv

# --- Base de datos ---
# Se pueden sobrescribir con variables de entorno al arrancar el JAR:
#   set DB_URL=jdbc:mysql://localhost:3306/BASE_CJV
#   set DB_USER=root
#   set DB_PASSWORD=585463
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/BASE_CJV}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:585463}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Servidor ---
# 0.0.0.0 = escucha en todas las interfaces de red (necesario para que
# otros equipos de la intranet puedan entrar). Puerto 8080.
server.address=0.0.0.0
server.port=8080

# --- CORS ---
# En el JAR único (mismo origen) no se usa. Para modo dos procesos, poner aquí
# la IP de la laptop, p. ej.: http://192.168.1.50:4200
app.cors.allowed-origins=http://localhost:4200
